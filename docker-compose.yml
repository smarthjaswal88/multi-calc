services:
  postgres:
    image: postgres:16-alpine
    container_name: multicalc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multicalc
    ports:
      - '5432:5432'
    volumes:
      - multicalc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d multicalc']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  multicalc-pgdata:
